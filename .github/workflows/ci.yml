name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Tauri needs a webview and GTK; the test suite shells out to ffmpeg
          # and frei0r, and several tests render real files and probe them.
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf \
            ffmpeg \
            frei0r-plugins

      - name: Report tool versions
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1
          echo "frei0r plugins: $(ls /usr/lib/frei0r-1/*.so 2>/dev/null | wc -l)"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Test
        working-directory: src-tauri
        # Several tests render with ffmpeg. Running them in parallel with
        # everything else exhausts process resources on a CI runner, so the
        # heavy ones take a lock internally; this keeps the rest parallel.
        run: cargo test --all-targets
