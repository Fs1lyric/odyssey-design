ShortDescription: Local-first editor for documents, spreadsheets, decks and video
Description: |-
  Odyssey Design is a local-first desktop application with four editors over a
  single record model: rich-text documents, a spreadsheet with a formula engine
  written in Rust, slide decks with a presenter mode, and a multi-track
  non-linear video editor built against ffmpeg.

  Everything is stored on the machine in one SQLite file. There is no account,
  no server and no sync.

  The video editor needs ffmpeg and ffprobe on PATH.
