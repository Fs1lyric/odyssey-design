[package]
name = "odyssey-design"
version = "0.1.0"
description = "Odyssey Design — documents, spreadsheets and decks, local-first"
authors = ["Nabhan Lyric Chowdhury <fs.lyric@proton.me>"]
edition = "2021"

[lib]
name = "odyssey_design_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tauri-plugin-dialog = "2.7.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
